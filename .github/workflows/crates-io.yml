name: "Crates.io setup test"

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  schedule:
    - cron: "0 17 * * 6" # Every Saturday at 17:00 UTC

  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.install }})
    runs-on: ["oneapi-rs", "Linux"]

    strategy:
      fail-fast: false
      matrix:
        install: [vendored, crates-io]
        exclude:
          # Do not test crates-io on push or pull request events
          - install: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'crates-io' || '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        # crates-io only needs the local setup action, not the sources under test.
        sparse-checkout: ${{ matrix.install == 'crates-io' && '.github/actions' || '' }}

    - name: Setup oneAPI
      uses: ./.github/actions/setup-oneapi

    - name: Create vendored source from current checkout
      if: matrix.install == 'vendored'
      run: |
        cargo init --bin "$RUNNER_TEMP/vendor-seed"
        cd "$RUNNER_TEMP/vendor-seed"
        cargo add sycl-rs --git "file://$GITHUB_WORKSPACE"
        cargo vendor --versioned-dirs "$RUNNER_TEMP/vendor" > "$RUNNER_TEMP/vendor-config.toml"

    - name: Query latest version on crates.io
      if: matrix.install == 'crates-io'
      id: latest
      run: |
        version=$(cargo search sycl-rs --limit 10 --color never | sed -nE 's/^sycl-rs = "([^"]+)".*/\1/p')
        if [ -z "$version" ]; then
          echo "::error::Could not find sycl-rs on crates.io"
          exit 1
        fi
        echo "Latest sycl-rs version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Create hello world project
      env:
        VERSION: ${{ steps.latest.outputs.version }}
      run: |
        cargo init --bin "$RUNNER_TEMP/crates-io-test"
        cd "$RUNNER_TEMP/crates-io-test"
        if [ -n "$VERSION" ]; then
          cargo add "sycl-rs@=$VERSION"
        else
          mkdir .cargo
          cp "$RUNNER_TEMP/vendor-config.toml" .cargo/config.toml
          cargo add sycl-rs
        fi
        cat > src/main.rs <<'RS'
        use sycl_rs::prelude::*;

        fn main() {
            let platform_count = Platform::get_platforms().len();
            println!("Hello from oneAPI-rs! Found {platform_count} SYCL platform(s).");
        }
        RS

    - name: Build
      working-directory: ${{ runner.temp }}/crates-io-test
      run: cargo build --verbose

    - name: Run hello world
      working-directory: ${{ runner.temp }}/crates-io-test
      run: cargo run --verbose
